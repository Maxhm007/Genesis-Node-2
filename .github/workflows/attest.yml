name: Genesis Node 2 Attestation

on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe primary chain and write attestation
        run: python scripts/attest.py
      - name: Publish attestation
        shell: bash
        run: |
          git config user.name "Genesis Node 2"
          git config user.email "genesis-node-2@users.noreply.github.com"
          git add attestation.json
          if git diff --cached --quiet; then
            echo "No attestation change"
            exit 0
          fi
          git commit -m "Attest Genesis blockchain head"
          git push
